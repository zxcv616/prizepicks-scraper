[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prizepicks-scraper"
version = "0.1.0"
description = "Fetch and parse PrizePicks projections (JSON:API) past DataDome, with append-only snapshot storage."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Open Source Contributors" }]
keywords = ["prizepicks", "dfs", "sports", "scraper", "props", "odds"]
# No required deps: the web-unlocker backend uses only the standard library.
dependencies = []

[project.optional-dependencies]
# Local-browser backend (not needed for --unlocker).
browser = ["playwright>=1.40", "patchright>=1.40"]
dev = ["pytest>=7"]

[project.scripts]
pps = "prizepicks_scraper.cli:main"
prizepicks = "prizepicks_scraper.cli:main"  # alias

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

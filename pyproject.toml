[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prizepicks-scraper"
version = "0.1.0"
description = "Fetch and parse PrizePicks projections (JSON:API) past DataDome, with append-only snapshot storage."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Open Source Contributors" }]
keywords = ["prizepicks", "dfs", "sports", "scraper", "props", "odds"]
dependencies = [
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
prizepicks = "prizepicks_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
